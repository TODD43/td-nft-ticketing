<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TD Event Pass</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#071426;color:#fff;margin:0}.wrap{max-width:850px;margin:60px auto;padding:24px}.card{border:1px solid #214466;border-radius:18px;padding:24px;background:#0b1d33}button{background:#2ea8ff;color:#03111e;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:700}input{background:#06101c;color:#fff;border:1px solid #315575;border-radius:10px;padding:12px;width:min(100%,600px);box-sizing:border-box}small{color:#9cb5cb}h1{letter-spacing:-.03em}
</style>
</head>
<body>
<div class="wrap">
  <h1>TD Event Pass</h1>
  <p>ERC-721-style event ticketing and digital membership demonstration.</p>
  <div class="card">
    <button onclick="connect()">Connect wallet</button>
    <p id="acct">Not connected</p>
    <label>Contract address</label><br><br>
    <input id="contract" placeholder="0x...">
    <p><small>Mint price is read directly from the deployed contract.</small></p>
    <button onclick="mint()">Mint Event Pass</button>
    <p id="status"></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>
<script>
let provider,signer;
const abi=['function mint() payable returns(uint256)','function mintPrice() view returns(uint256)'];
async function connect(){
  if(!window.ethereum)return alert('Install MetaMask');
  provider=new ethers.BrowserProvider(window.ethereum);
  await provider.send('eth_requestAccounts',[]);
  signer=await provider.getSigner();
  document.getElementById('acct').textContent=await signer.getAddress();
}
async function mint(){
  try{
    if(!signer)await connect();
    const address=document.getElementById('contract').value.trim();
    if(!ethers.isAddress(address))throw new Error('Enter a valid contract address');
    const c=new ethers.Contract(address,abi,signer);
    const price=await c.mintPrice();
    const tx=await c.mint({value:price});
    document.getElementById('status').textContent='Waiting for confirmation...';
    await tx.wait();
    document.getElementById('status').textContent='Minted. TX: '+tx.hash;
  }catch(e){document.getElementById('status').textContent=e.shortMessage||e.message}
}
</script>
</body>
</html>
